name: Build, Push, and Deploy

on:
  push:
    branches:
      - main

jobs:
  # Phase 1: Continuous Integration
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/fastapi-cloud"
          docker build \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${GITHUB_SHA}" \
            .
          #this will make 2 versions of the image, one with the latest tag and one with the commit SHA as a tag for versioning purposes. This is useful for rollbacks or tracking specific builds.
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"

  # Phase 2: Continuous Deployment (New Step)
  deploy:
    needs: build-and-push # Tells github to wait until Phase 1 finishes
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. pull the fresh image you just built
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-cloud:latest

            # 2. Stop and remove the old container (if it exists)
            sudo docker stop fastapi-container || true
            sudo docker rm fastapi-container || true

            # 3. Run the new container
            sudo docker run -d --name fastapi-container -p 8000:8000 ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-cloud:latest
