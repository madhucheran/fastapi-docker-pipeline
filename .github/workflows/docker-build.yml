name: Build, Push, and Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: fastapi-production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Phase 1: Continuous Integration
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="$DOCKERHUB_USERNAME/fastapi-cloud"

          docker build \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${GITHUB_SHA}" \
            .

          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"

  # Phase 2: Continuous Deployment
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare deployment directory on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/deployment

      - name: Copy deployment script to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "scripts/deploy.sh"
          target: "/home/ubuntu/deployment/"
          strip_components: 1
          overwrite: true

      - name: Deploy versioned Docker image
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            chmod +x /home/ubuntu/deployment/deploy.sh

            bash /home/ubuntu/deployment/deploy.sh \
              "${{ secrets.DOCKERHUB_USERNAME }}/fastapi-cloud:${{ github.sha }}"