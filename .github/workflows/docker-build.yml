name: Build Docker Image

# 1. The Trigger: When should this run?
on:
  push:
    branches:
      - main

jobs:
  build-container:
    # 2. The Environment: What OS should the temporary cloud server use?
    runs-on: ubuntu-latest

    steps:
      # 3. The Code: Download your repository onto the temporary server
      - name: Check out repository code
        uses: actions/checkout@v4

      # 4. The Action: Run your local Docker build command
      - name: Build the Docker image
        run: docker build -t fastapi-cloud .